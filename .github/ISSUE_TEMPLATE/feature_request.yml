name: Feature request
description: An idea that would make Hangar more useful.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea. Please write in English.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could Hangar solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Workarounds or other approaches you have considered.
