# Known vulnerabilities in the locked dependencies, once a week: an advisory published after the
# last push would otherwise go unnoticed until the next code change (CI skips pushes that only
# touch documentation). The same steps as the `audit` job in ci.yml.
name: Audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust dependencies
        run: |
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file crates/hangar-team-crypto/Cargo.lock
          cargo audit --file crates/hangar-team-protocol/Cargo.lock

      # Licenses and sources of the app's crates (src-tauri/deny.toml): permissive licenses only,
      # crates.io only.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Rust licenses and sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses sources bans

      # Reads pnpm-lock.yaml only; nothing is installed or run.
      - name: npm dependencies
        run: pnpm audit
