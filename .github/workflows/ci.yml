# The check suite (see CONTRIBUTING.md) on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
    # A push that only touches documentation, images or the wiki changes nothing the check suite
    # tests, so it starts no run on three platforms.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:

# The check suite only reads, so a pull request from a fork gets no write access.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A hung test or install must not hold a runner for the default six hours.
    timeout-minutes: 60
    steps:
      # Third-party actions are pinned to a commit (a tag can be moved); Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step pushes; the token must not stay in .git/config for the build scripts
          # and test programs that run after it.
          persist-credentials: false

      # Without a `version` input the action installs the pnpm that `packageManager` in
      # package.json names (README of this pinned commit), so that field is the only source.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Per the Tauri prerequisites for Linux: WebKitGTK 4.1 and companion libraries. The local
      # dictation builds whisper.cpp from source (CMake, libclang for bindgen) and captures the
      # microphone through ALSA.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake clang libclang-dev libasound2-dev

      # whisper.cpp on Windows: CMake and the MSVC compiler come with the runner image; bindgen
      # needs libclang, which LLVM provides (installed only when the image lacks it).
      - name: Windows whisper.cpp tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install llvm --no-progress -y
          fi
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          cmake --version

      # whisper.cpp on macOS: Apple's clang and libclang come with Xcode; CMake from Homebrew if
      # the runner image lacks it.
      - name: macOS whisper.cpp tools
        if: runner.os == 'macOS'
        run: |
          command -v cmake >/dev/null || brew install cmake
          cmake --version

      - run: pnpm install --frozen-lockfile

      - name: Frontend
        run: |
          pnpm format:check
          pnpm lint
          pnpm test
          pnpm build

      # After pnpm build, because tauri::generate_context! expects the dist/ folder. --locked:
      # the build uses exactly Cargo.lock and fails if it would have to change it.
      # --no-fail-fast: a failing test binary must not hide the binaries after it (the
      # integration tests run only after the library's own tests).
      - name: Backend
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast

      # The team crates build on their own (no Tauri, own lock files); each Python reference
      # recomputes its crate's test vectors with the standard library.
      - name: Team crates
        shell: bash
        run: |
          # macOS and Linux runners name the interpreter python3, Windows runners python; a
          # python3 that is only the Microsoft Store stub exists but does not run, so each
          # candidate has to start before it is used.
          for candidate in python3 python; do
            if "$candidate" -c "import sys; sys.exit(sys.version_info < (3, 8))" 2>/dev/null; then
              py="$candidate"
              break
            fi
          done
          : "${py:?no Python 3.8 or newer found}"
          for crate in hangar-team-protocol hangar-team-crypto; do
            cargo fmt --manifest-path "crates/$crate/Cargo.toml" --check
            cargo clippy --manifest-path "crates/$crate/Cargo.toml" --all-targets --locked -- -D warnings
            cargo test --manifest-path "crates/$crate/Cargo.toml" --locked --no-fail-fast
            "$py" "crates/$crate/test_vectors.py"
          done

  # The Linux bundles (ADR 0013): an AppImage and a .deb, unsigned. Built on the oldest Ubuntu
  # Hangar supports, because a binary only runs where glibc is at least as new as on the build
  # machine. Updater signatures are made by tools/release.py on the owner's machine; no signing
  # key ever reaches CI, so updater artifacts are turned off here as release.py does.
  linux-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # The same packages as the check job, plus patchelf for the AppImage tooling.
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake clang libclang-dev libasound2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: >-
          pnpm tauri build --bundles appimage,deb
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          -- --locked

      # hangar-send (ADR 0012) has to be in both bundles, next to the app. The highest glibc
      # symbol version is the oldest glibc the bundles run on. The AppRun hooks show which
      # variables the image sets for Hangar (child_env.rs undoes them for child processes).
      - name: Check bundles
        run: |
          set -euo pipefail
          bundle="$PWD/src-tauri/target/release/bundle"
          image=$(ls "$bundle"/appimage/*.AppImage)
          deb=$(ls "$bundle"/deb/*.deb)
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract >/dev/null
          root="$RUNNER_TEMP/squashfs-root"
          if [ ! -x "$root/usr/bin/hangar-send" ]; then
            echo "::error::hangar-send is missing from the AppImage"
            exit 1
          fi
          # Listed into a variable first: `grep -q` in a pipe would end dpkg-deb with SIGPIPE.
          contents=$(dpkg-deb -c "$deb")
          if ! grep -q ' ./usr/bin/hangar-send$' <<<"$contents"; then
            echo "::error::hangar-send is missing from the .deb"
            exit 1
          fi
          # objdump fails on files that are not ELF; the ELF ones still print their symbols.
          symbols=$(objdump -T "$root"/usr/bin/* 2>/dev/null || true)
          glibc=$(grep -o 'GLIBC_[0-9.]*' <<<"$symbols" | sort -uV | tail -n 1)
          echo "Highest glibc symbol version: $glibc"
          echo "Depends of the .deb: $(dpkg-deb -f "$deb" Depends)"
          {
            echo "### Linux bundles"
            echo "- Highest glibc symbol version: \`$glibc\`"
            echo "- .deb Depends: \`$(dpkg-deb -f "$deb" Depends)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la "$root/usr/bin"
          for hook in "$root"/apprun-hooks/*; do
            [ -f "$hook" ] || continue
            echo "--- $hook"
            cat "$hook"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # Known vulnerabilities in the locked dependencies. cargo-audit is installed at a fixed version
  # from its own lock file; it fails on vulnerabilities and only warns about unmaintained crates.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust dependencies
        run: |
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file crates/hangar-team-crypto/Cargo.lock
          cargo audit --file crates/hangar-team-protocol/Cargo.lock

      # Reads pnpm-lock.yaml only; nothing is installed or run.
      - name: npm dependencies
        run: pnpm audit --prod
