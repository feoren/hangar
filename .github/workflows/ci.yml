# The check suite (see CONTRIBUTING.md) on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
    # A push that only touches documentation, images or the wiki changes nothing the check suite
    # tests, so it starts no run on three platforms.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:

# The check suite only reads, so a pull request from a fork gets no write access.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A hung test or install must not hold a runner for the default six hours.
    timeout-minutes: 60
    steps:
      # Third-party actions are pinned to a commit (a tag can be moved); Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step pushes; the token must not stay in .git/config for the build scripts
          # and test programs that run after it.
          persist-credentials: false

      # Without a `version` input the action installs the pnpm that `packageManager` in
      # package.json names (README of this pinned commit), so that field is the only source.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Per the Tauri prerequisites for Linux: WebKitGTK 4.1 and companion libraries. The local
      # dictation builds whisper.cpp from source (CMake, libclang for bindgen) and captures the
      # microphone through ALSA.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake clang libclang-dev libasound2-dev

      # whisper.cpp on Windows: CMake and the MSVC compiler come with the runner image; bindgen
      # needs libclang, which LLVM provides (installed only when the image lacks it).
      - name: Windows whisper.cpp tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install llvm --no-progress -y
          fi
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          cmake --version

      # whisper.cpp on macOS: Apple's clang and libclang come with Xcode; CMake from Homebrew if
      # the runner image lacks it.
      - name: macOS whisper.cpp tools
        if: runner.os == 'macOS'
        run: |
          command -v cmake >/dev/null || brew install cmake
          cmake --version

      - run: pnpm install --frozen-lockfile

      # bash on every runner: in pwsh only the last line's exit code counts, so a red
      # format:check, lint or test would pass as long as pnpm build succeeds.
      - name: Frontend
        shell: bash
        run: |
          pnpm format:check
          pnpm lint
          pnpm test
          pnpm build

      # After pnpm build, because tauri::generate_context! expects the dist/ folder. --locked:
      # the build uses exactly Cargo.lock and fails if it would have to change it.
      # --no-fail-fast: a failing test binary must not hide the binaries after it (the
      # integration tests run only after the library's own tests).
      - name: Backend
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast

      # The team crates build on their own (no Tauri, own lock files); each Python reference
      # recomputes its crate's test vectors with the standard library.
      - name: Team crates
        shell: bash
        run: |
          # macOS and Linux runners name the interpreter python3, Windows runners python; a
          # python3 that is only the Microsoft Store stub exists but does not run, so each
          # candidate has to start before it is used.
          for candidate in python3 python; do
            if "$candidate" -c "import sys; sys.exit(sys.version_info < (3, 8))" 2>/dev/null; then
              py="$candidate"
              break
            fi
          done
          : "${py:?no Python 3.8 or newer found}"
          for crate in hangar-team-protocol hangar-team-crypto; do
            cargo fmt --manifest-path "crates/$crate/Cargo.toml" --check
            cargo clippy --manifest-path "crates/$crate/Cargo.toml" --all-targets --locked -- -D warnings
            cargo test --manifest-path "crates/$crate/Cargo.toml" --locked --no-fail-fast
            "$py" "crates/$crate/test_vectors.py"
          done

  # The Linux bundles (ADR 0013): an AppImage and a .deb, unsigned. Built on the oldest Ubuntu
  # Hangar supports, because a binary only runs where glibc is at least as new as on the build
  # machine. Updater signatures are made by tools/release.py on the owner's machine; no signing
  # key ever reaches CI, so updater artifacts are turned off here as release.py does.
  linux-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # The same packages as the check job, plus patchelf for the AppImage tooling.
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            cmake clang libclang-dev libasound2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: >-
          pnpm tauri build --bundles appimage,deb
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          -- --locked

      # hangar-send (ADR 0012) has to be in both bundles, next to the app. The highest glibc
      # symbol version is the oldest glibc the bundles run on. The AppRun hooks show which
      # variables the image sets for Hangar (child_env.rs undoes them for child processes).
      - name: Check bundles
        run: |
          set -euo pipefail
          bundle="$PWD/src-tauri/target/release/bundle"
          image=$(ls "$bundle"/appimage/*.AppImage)
          deb=$(ls "$bundle"/deb/*.deb)
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract >/dev/null
          root="$RUNNER_TEMP/squashfs-root"
          if [ ! -x "$root/usr/bin/hangar-send" ]; then
            echo "::error::hangar-send is missing from the AppImage"
            exit 1
          fi
          # The updater picks its entry in latest.json by the bundle type the bundler patches into
          # the binary (linux-x86_64-appimage, tools/release.py); unpatched, AppImages get no update.
          # Not the _APP string alone: tauri-utils keeps it as a match arm in every binary. The
          # bundler overwrites the placeholder _UNK, so that one must be gone.
          if grep -q __TAURI_BUNDLE_TYPE_VAR_UNK "$root/usr/bin/hangar"; then
            echo "::error::the hangar binary in the AppImage carries no AppImage bundle type"
            exit 1
          fi
          # Listed into a variable first: `grep -q` in a pipe would end dpkg-deb with SIGPIPE.
          # The bundler writes its tar paths without a leading "./" (tauri-bundler, debian.rs,
          # create_tar_from_dir), dpkg-built packages with one; either form counts.
          contents=$(dpkg-deb -c "$deb")
          if ! grep -Eq ' (\./)?usr/bin/hangar-send$' <<<"$contents"; then
            echo "::error::hangar-send is missing from the .deb"
            exit 1
          fi
          # objdump fails on files that are not ELF; the ELF ones still print their symbols.
          symbols=$(objdump -T "$root"/usr/bin/* 2>/dev/null || true)
          glibc=$(grep -o 'GLIBC_[0-9.]*' <<<"$symbols" | sort -uV | tail -n 1)
          echo "Highest glibc symbol version: $glibc"
          echo "Depends of the .deb: $(dpkg-deb -f "$deb" Depends)"
          {
            echo "### Linux bundles"
            echo "- Highest glibc symbol version: \`$glibc\`"
            echo "- .deb Depends: \`$(dpkg-deb -f "$deb" Depends)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la "$root/usr/bin"
          for hook in "$root"/apprun-hooks/*; do
            [ -f "$hook" ] || continue
            echo "--- $hook"
            cat "$hook"
          done

      # The window, not just the bundle, as on macOS: the AppImage (unpacked by the step above, so
      # FUSE is not needed) must start on a virtual X display with its own session bus and stay up
      # for 30 s. The screenshot shows how WebKitGTK draws the first start. Its artifact has its own
      # name; tools/release.py downloads "linux-bundles" by exact name.
      - name: Start test
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb imagemagick dbus
          shots="$RUNNER_TEMP/linux-start"
          mkdir -p "$shots"
          cat > "$RUNNER_TEMP/start-test.sh" <<'EOF'
          set -u
          "$RUNNER_TEMP/squashfs-root/AppRun" >"$SHOTS/hangar.log" 2>&1 &
          pid=$!
          sleep 30
          alive=yes
          kill -0 "$pid" 2>/dev/null || alive=no
          import -window root "$SHOTS/start-x64.png" || echo "::warning::no screenshot"
          if [ "$alive" = yes ]; then
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          fi
          echo "$alive" >"$SHOTS/alive"
          EOF
          # Xvfb has no GPU: WebKitGTK's DMA-BUF renderer would fail there, so it draws in shared
          # memory instead.
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          # Without a window manager the 1280x800 window is placed with its corner at the screen's
          # centre, so the screen is twice its size and the whole window lands on it.
          SHOTS="$shots" dbus-run-session -- \
            xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24" \
            bash "$RUNNER_TEMP/start-test.sh"
          alive=$(cat "$shots/alive")
          {
            echo "### Linux start (x64)"
            echo "- Still running after 30 s: \`$alive\`"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$shots/hangar.log"
          if [ "$alive" != yes ]; then
            echo "::error::Hangar ended within 30 s of starting"
            exit 1
          fi

      - name: Upload start test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-start-x64
          path: ${{ runner.temp }}/linux-start/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # The macOS bundles (ADR 0017): per architecture the .app, signed ad hoc unless an Apple
  # Developer ID is set up, as the updater archive (.app.tar.gz) plus a .dmg for the download.
  # Each builds natively: Apple silicon on macos-latest, Intel on the last Intel image. As for
  # Linux, the updater key never reaches CI: updater artifacts are off and tools/release.py signs
  # the archive on the owner's machine.
  macos-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            lipo: arm64
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            arch: x64
            lipo: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # The oldest macOS the bundles run on, for rustc and for whisper.cpp's CMake alike; the same
      # value as bundle.macOS.minimumSystemVersion.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: macOS whisper.cpp tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          cmake --version

      - run: pnpm install --frozen-lockfile

      # With an Apple Developer ID, the bundler signs with it and notarizes (Tauri's macOS signing
      # guide). The secrets live only in this step's environment, never in $GITHUB_ENV, so the
      # later steps (the start test runs the built app, the uploads) cannot read them. Empty
      # variables are unset before the build: an empty APPLE_SIGNING_IDENTITY would replace the
      # ad hoc identity "-" of tauri.conf.json, an empty APPLE_CERTIFICATE would fail the import.
      # Without the secrets (no account yet, pull requests from forks) the bundle is signed ad hoc.
      - name: Build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No Apple Developer ID: the bundle is signed ad hoc and not notarized."
          else
            echo "Apple Developer ID set: the bundle is signed with it and notarized."
          fi
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            export APPLE_API_KEY_PATH="$key"
            trap 'rm -f "$key"' EXIT
          fi
          unset APPLE_API_PRIVATE_KEY
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            [ -n "${!name}" ] || unset "$name"
          done
          pnpm tauri build --target "$TARGET" --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            -- --locked

      # The updater archive is what tauri-bundler writes with updater artifacts on: a gzip tar
      # with Hangar.app as its only top folder (tauri-plugin-updater 2.14.1 drops the first path
      # part while extracting). Without macOS metadata: bsdtar would add AppleDouble "._" entries.
      # The name carries version and arch, so tools/release.py can tell a stale archive.
      - name: Updater archive
        run: |
          set -euo pipefail
          bundle="$PWD/src-tauri/target/${{ matrix.target }}/release/bundle"
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out="$RUNNER_TEMP/macos-bundles"
          mkdir -p "$out"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C "$bundle/macos" \
            -czf "$out/Hangar_${version}_${{ matrix.arch }}.app.tar.gz" Hangar.app
          cp "$bundle"/dmg/*.dmg "$out/"
          ls -la "$out"

      # The checks name what a user's Mac would refuse: hangar-send (ADR 0012) next to the app, the
      # minimum macOS in the binary and in Info.plist, the architecture, a valid signature with the
      # microphone entitlement, and an archive that unpacks into the same valid app.
      - name: Check bundles
        run: |
          set -euo pipefail
          bundle="$PWD/src-tauri/target/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/Hangar.app"
          out="$RUNNER_TEMP/macos-bundles"
          for bin in hangar hangar-send; do
            if [ ! -x "$app/Contents/MacOS/$bin" ]; then
              echo "::error::$bin is missing from Hangar.app"
              exit 1
            fi
            archs=$(lipo -archs "$app/Contents/MacOS/$bin")
            if [ "$archs" != "${{ matrix.lipo }}" ]; then
              echo "::error::$bin is built for '$archs', not ${{ matrix.lipo }}"
              exit 1
            fi
            minos=$(otool -l "$app/Contents/MacOS/$bin" | awk '/LC_BUILD_VERSION/ {found=1} found && $1 == "minos" {print $2; exit}')
            if [ "$minos" != "13.0" ]; then
              echo "::error::$bin needs macOS '$minos', not 13.0"
              exit 1
            fi
          done
          plist="$app/Contents/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "13.0" ]
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$plist" >/dev/null
          codesign --verify --deep --strict --verbose=2 "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          echo "$signature"
          # Under the hardened runtime the microphone needs the entitlement; without the runtime
          # flag (ad hoc signing may leave it off) macOS asks for the usage text only.
          entitlements=$(codesign -d --entitlements - --xml "$app" 2>/dev/null || true)
          if grep -Eq '^CodeDirectory.*flags=.*runtime' <<<"$signature" \
            && ! grep -q 'com.apple.security.device.audio-input' <<<"$entitlements"; then
            echo "::error::the hardened signature lacks the audio-input entitlement"
            exit 1
          fi
          # The signed client must start; without arguments it prints its usage.
          usage=$("$app/Contents/MacOS/hangar-send" </dev/null 2>&1 || true)
          if ! grep -q 'Usage: hangar-send' <<<"$usage"; then
            echo "::error::hangar-send does not start: $usage"
            exit 1
          fi
          archive=$(ls "$out"/*.app.tar.gz)
          listing=$(tar -tzf "$archive")
          if grep -Eq '(^|/)\._' <<<"$listing" || grep -vq '^Hangar\.app/' <<<"$listing"; then
            echo "::error::the updater archive holds more than Hangar.app"
            exit 1
          fi
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          codesign --verify --deep --strict "$unpacked/Hangar.app"
          {
            echo "### macOS bundle (${{ matrix.arch }})"
            echo "- Signature: \`$(grep -E '^(Authority|Signature)=' <<<"$signature" | head -n 1)\`"
            echo "- Minimum macOS: \`13.0\`"
            ls "$out" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # The window, not just the bundle: the app from the unpacked updater archive (what an update
      # installs) must start and stay up. The runner has a logged-in desktop, so the screenshot
      # shows what a first start looks like. Gatekeeper's verdict on a downloaded copy (quarantine
      # attribute set as a browser would) goes into the summary as information only: without a
      # Developer ID it rejects the app, which is the documented "Open Anyway" path (ADR 0017).
      - name: Start test
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/unpacked/Hangar.app"
          shots="$RUNNER_TEMP/macos-start"
          mkdir -p "$shots"
          "$app/Contents/MacOS/hangar" >"$shots/hangar.log" 2>&1 &
          pid=$!
          sleep 30
          alive=yes
          kill -0 "$pid" 2>/dev/null || alive=no
          screencapture -x "$shots/start-${{ matrix.arch }}.png" || echo "::warning::no screenshot"
          if [ "$alive" = yes ]; then
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          fi
          downloaded="$RUNNER_TEMP/downloaded"
          mkdir -p "$downloaded"
          ditto "$app" "$downloaded/Hangar.app"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" \
            "$downloaded/Hangar.app"
          verdict=$(spctl --assess --type execute -vv "$downloaded/Hangar.app" 2>&1 || true)
          {
            echo "### macOS start (${{ matrix.arch }})"
            echo "- Still running after 30 s: \`$alive\`"
            echo "- Gatekeeper on a downloaded copy: \`$(head -n 1 <<<"$verdict")\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict"
          cat "$shots/hangar.log"
          if [ "$alive" != yes ]; then
            echo "::error::Hangar ended within 30 s of starting"
            exit 1
          fi

      - name: Upload start test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-start-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-start/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bundles-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-bundles/
          if-no-files-found: error
          retention-days: 14

  # One artifact "macos-bundles" with both architectures, the one tools/release.py --macos
  # downloads. The per-arch artifacts stay (deleting them would need write access to Actions).
  macos-bundles:
    needs: macos-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bundles
          pattern: macos-bundles-*
          retention-days: 14

  # Known vulnerabilities in the locked dependencies. cargo-audit is installed at a fixed version
  # from its own lock file; it fails on vulnerabilities and only warns about unmaintained crates.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust dependencies
        run: |
          cargo audit --file src-tauri/Cargo.lock
          cargo audit --file crates/hangar-team-crypto/Cargo.lock
          cargo audit --file crates/hangar-team-protocol/Cargo.lock

      # Licenses and sources of the app's crates (src-tauri/deny.toml): permissive licenses only,
      # crates.io only.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Rust licenses and sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses sources bans

      # Reads pnpm-lock.yaml only; nothing is installed or run. Without --prod: the build chain
      # (vite, the Tauri CLI) produces the shipped bundle, so its advisories count too.
      - name: npm dependencies
        run: pnpm audit
