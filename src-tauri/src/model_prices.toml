# Model prices for the cost estimate (cost_service.rs), in US dollars per million tokens.
#
# A model that is not listed here shows tokens only, never an invented price. Add or change
# entries without a rebuild in `model-prices.toml` next to profiles.toml (same format; an entry
# with the same `id` replaces the one below).
#
# `id` matches the model id of a response exactly, with an optional date suffix
# (`-20251101`) or option suffix (`[1m]`); `claude-opus-5` does not match `claude-opus-5-5`.
# Cache writes default to 1.25 x `input` (5 minutes) and 2 x `input` (1 hour); cache reads to
# 0.1 x `input`. `fast_factor` multiplies every price of a fast mode response; without it a
# fast response has no price. `long_above`: from this many prompt tokens (input plus cache) on,
# `long_input` and `long_output` apply instead.

source = "Claude API model table and pricing notes (platform.claude.com/docs/en/about-claude/pricing)"
