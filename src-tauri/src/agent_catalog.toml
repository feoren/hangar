# Built-in catalog of the known agent CLIs. Embedded into Hangar at build time
# (include_str!) and not editable by the user. To start an entry differently, add a [[profile]]
# with the same id to your profiles.toml. It determines name, command, arguments and
# position; homepage and install command still come from here.
#
# Hangar lists every entry under "New session" and checks on every fetch of the list whether one of
# the commands from `commands` is on the PATH. If not, the entry shows up as "not installed" with
# the platform's install command.
#
# Fields per entry (unknown fields are an error):
#   id               Required. Unique, without spaces. Same id as a user profile = overridden.
#   name             Required. Display name.
#   commands         Required, at least one entry. Plain program names without path and without extension
#                    (on Windows Hangar adds the extensions from PATHEXT). The first name found
#                    on the PATH wins and is also used for starting.
#   args             Optional. Arguments as a list; default: none.
#   icon             Optional. One or two characters for the icon in the sidebar.
#   homepage         Project page, display only (the catalog test requires it as a source).
#   install_windows  Optional. Install command as text, displayed on Windows.
#   install_unix     Optional. Install command as text, displayed on macOS and Linux.
#                    Hangar never runs install commands itself.
#   version_args     Optional. Arguments of the version query (ADR 0003); default ["--version"],
#                    [] = never query.
#   resume_args      Optional. Arguments to resume the last conversation in the working folder
#                    (when restoring a session after Hangar restarts). They
#                    REPLACE args and append nothing: a subcommand from args must come first
#                    here again (goose: args ["session"], resume_args ["session", "--resume"]).
#                    If a resume ends within 5 s with a nonzero exit code, Hangar starts once
#                    normally with args. Only add with evidence (docs/wiki/pages/agents/resume.md).
#   session_id_args  Optional. Arguments that give a fresh start a conversation id chosen by
#                    Hangar; {id} is replaced by a new UUID. APPENDED to args. Hangar stores the id
#                    with the session. A user profile with the same id and program inherits it
#                    (and resume_id_args) unless its args already contain --session-id, --resume,
#                    --continue, -c or -r; `session_id_args = []` in the profile turns it off.
#   resume_id_args   Optional. Arguments that resume exactly the conversation with the stored id
#                    ({id}). They REPLACE args; sessions without a stored id use resume_args. If
#                    this resume ends within 5 s with a nonzero exit code, Hangar starts once
#                    normally with args plus session_id_args and the same id.
#   sub_agents       Optional. Where the program keeps sub-agent transcripts that Hangar can show
#                    read-only; only "claude" so far (docs/wiki/pages/sources/subagent-transcripts.md).
#   latest           Optional. Where the newest version is published, exactly one source:
#                    { npm = "<package>" }, { pypi = "<package>" } or
#                    { github = "<owner>/<repo>", tag_prefix = "v" }. Only the /latest endpoint
#                    is queried. compare = "equal" reports an update on any difference instead of
#                    only on a higher version (for versions that cannot be ordered, as with amp).
#   update_hint      Optional. { windows = "...", unix = "..." }: update command. Hangar
#                    shows it and, on click, runs it as a session of its own, split at whitespace into
#                    argv, without a shell. So only a simple command without shell syntax
#                    (no | & ; < > $ ` ( ) " ' % ^ ! * ? [ ] { } # ~), program as a bare name
#                    or absolute path, otherwise Hangar rejects it. The block prevents wrong
#                    splitting and interpretation by cmd.exe; it is not a sandbox: update_hint is as
#                    trustworthy as command.
#                    If it is missing for the platform, Hangar shows install_* for copying only.
#                    Values and evidence: docs/wiki/pages/agents/updates.md.
#
# Source of all entries: official vendor docs, as of 2026-11-07
# (docs/wiki/raw/2026-11-07-agent-clis-research.md, rules in docs/wiki/pages/agents/catalog.md).
# install_* only if the command is in the vendor docs. Generic names such as `q` (the old
# Amazon Q CLI) and `kd` (Kode) stay out on purpose, because they could hit other programs.
# Spot check before every release; installation methods change quickly.

[[agent]]
id = "claude"
name = "Claude Code"
commands = ["claude"]
resume_args = ["--continue"]
session_id_args = ["--session-id", "{id}"]
resume_id_args = ["--resume", "{id}"]
sub_agents = "claude"
icon = "C"
homepage = "https://github.com/anthropics/claude-code"
install_windows = "irm https://claude.ai/install.ps1 | iex"
install_unix = "curl -fsSL https://claude.ai/install.sh | bash"
latest = { npm = "@anthropic-ai/claude-code" }
update_hint = { windows = "claude update", unix = "claude update" }

[[agent]]
id = "codex"
name = "Codex CLI"
commands = ["codex"]
resume_args = ["resume", "--last"]
icon = "Cx"
homepage = "https://github.com/openai/codex"
install_windows = "powershell -ExecutionPolicy ByPass -c \"irm https://chatgpt.com/codex/install.ps1 | iex\""
install_unix = "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
latest = { npm = "@openai/codex" }

[[agent]]
id = "gemini"
name = "Gemini CLI"
