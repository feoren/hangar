# Built-in catalog of the known agent CLIs. Embedded into Hangar at build time
# (include_str!) and not editable by the user. To start an entry differently, add a [[profile]]
# with the same id to your profiles.toml. It determines name, command, arguments and
# position; homepage and install command still come from here.
#
# Hangar lists every entry under "New session" and checks on every fetch of the list whether one of
# the commands from `commands` is on the PATH. If not, the entry shows up as "not installed" with
# the platform's install command.
#
# Fields per entry (unknown fields are an error):
#   id               Required. Unique, without spaces. Same id as a user profile = overridden.
#   name             Required. Display name.
#   commands         Required, at least one entry. Plain program names without path and without extension
#                    (on Windows Hangar adds the extensions from PATHEXT). The first name found
#                    on the PATH wins and is also used for starting.
#   args             Optional. Arguments as a list; default: none.
#   icon             Optional. One or two characters for the icon in the sidebar.
#   homepage         Project page, display only (the catalog test requires it as a source).
#   install_windows  Optional. Install command as text, displayed on Windows.
#   install_unix     Optional. Install command as text, displayed on macOS and Linux.
#                    Hangar never runs install commands itself.
#   version_args     Optional. Arguments of the version query (ADR 0003); default ["--version"],
#                    [] = never query.
#   resume_args      Optional. Arguments to resume the last conversation in the working folder
#                    (when restoring a session after Hangar restarts). They
#                    REPLACE args and append nothing: a subcommand from args must come first
#                    here again (goose: args ["session"], resume_args ["session", "--resume"]).
#                    If a resume ends within 5 s with a nonzero exit code, Hangar starts once
#                    normally with args. Only add with evidence (docs/wiki/pages/agents/resume.md).
#   session_id_args  Optional. Arguments that give a fresh start a conversation id chosen by
#                    Hangar; {id} is replaced by a new UUID. APPENDED to args. Hangar stores the id
#                    with the session. A user profile with the same id and program inherits it
#                    (and resume_id_args) unless its args already contain --session-id, --resume,
#                    --continue, -c or -r; `session_id_args = []` in the profile turns it off.
#   resume_id_args   Optional. Arguments that resume exactly the conversation with the stored id
#                    ({id}). They REPLACE args; sessions without a stored id use resume_args. If
#                    this resume ends within 5 s with a nonzero exit code, Hangar starts once
#                    normally with args plus session_id_args and the same id.
#   sub_agents       Optional. Where the program keeps sub-agent transcripts that Hangar can show
#                    read-only; only "claude" so far (docs/wiki/pages/sources/subagent-transcripts.md).
#   capabilities     Optional. What Hangar's agent gate can do with the program (team service
#                    step B, docs/wiki/pages/syntheses/team-service-v1.md, section 1), all false by
#                    default: { pre_edit_block, context_inject, per_session_config,
#                    hook_format, measured, min_version, version_gap }.
#                    pre_edit_block: a hook can stop an edit before it happens; context_inject: a
#                    hook can hand the agent facts as context; per_session_config: hooks can be
#                    given to one session without touching the user's settings files;
#                    hook_format: how Hangar writes its hooks for one session:
#                    "claude_settings" (Claude Code's `--settings`), "qwen_system_settings",
#                    "gemini_system_settings", "copilot_plugin", "codex_config_flags",
#                    "pi_extension", "omp_extension", "opencode_plugin", "droid_settings" or
#                    "cursor_plugin"
#                    (recipes in src-tauri/src/hook_recipes.rs and
#                    docs/wiki/pages/syntheses/agent-gate-adapters.md); measured: the recipe was
#                    run once against the live program and held an edit; min_version: oldest
#                    version the recipe is known to work with (checked with the version query of
#                    ADR 0003); version_gap: { from, below }, versions between two measured
#                    ones that are not measured themselves (they count as not measured). Hangar installs its
#                    gate, and lists the program for team
#                    sessions, only where pre_edit_block, per_session_config and measured are
#                    true, hook_format is set, the installed version reaches min_version (an
#                    unknown version does not) and no administrator's system settings file would
#                    be replaced (Gemini CLI, Qwen Code; for OpenCode an OPENCODE_CONFIG_CONTENT
#                    of the user's own in Hangar's environment).
#                    A user profile with the same id and program inherits them.
#   instruction_args Optional. Arguments that hand the program Hangar's global instructions
#                    (HANGAR.md in the config folder, when Settings turns it on), placed before
#                    the start arguments. Exactly one placeholder: {text} the file's content
#                    without HTML comments, {toml_text} that content as a TOML string (for
#                    `-c key=value` overrides that parse the value as TOML), {file} the file's
#                    path. Prefer {file} where the program takes one (the text is visible on the
#                    command line), and an `--option={text}` form so a text starting with `-`
#                    is never read as an option. Left out with a logged warning: the text for a
#                    cmd.exe launcher (npm's codex.cmd; Settings names such programs), and
#                    anything that would push the quoted command line past 32 766 characters.
#                    Only an append mechanism that
#                    keeps the program's own prompt, never one that replaces it (Gemini CLI's
#                    GEMINI_SYSTEM_MD). Evidence: docs/wiki/pages/syntheses/agent-instructions.md.
#   prompt_args      Optional. Arguments appended to a fresh start that make {prompt} the first
#                    user message of an interactive session (never one that runs the prompt and
#                    exits, as Aider's --message). Used for the [start_prompts] below.
#                    A user profile with the same id and program inherits both.
#   agent_args       Optional. Arguments placed right after the start arguments that start the
#                    session as the sub-agent definition {agent} (a checked name, see
#                    src-tauri/src/agent_defs.rs). Only programs that read the definitions in
#                    ~/.claude/agents and <project>/.claude/agents. Inherited like prompt_args.
#   agent_program    Optional. "claude", "codex", "copilot", "opencode" or "gemini": the program
#                    reads sub-agent definitions in that format (.claude/agents/*.md,
#                    .codex/agents/*.toml, ~/.copilot/agents/*.agent.md,
#                    ~/.config/opencode/agents/*.md, ~/.gemini/agents/*.md) and, when it is not
#                    Claude Code, gets copies of the user's Claude Code definitions
#                    (src-tauri/src/agent_provision.rs, src-tauri/src/md_agents.rs). Only "claude"
#                    and "codex" take a default model for them from Settings > Sub-agents. The
#                    Markdown formats get copies only from the version they were measured with
#                    (agent_provision::min_version). Only formats measured against the installed
#                    program: docs/wiki/pages/sources/sub-agent-formats-measurement.md.
#                    Inherited like prompt_args.
#   latest          Optional. Where the newest version is published, exactly one source:
#                    { npm = "<package>" }, { pypi = "<package>" } or
#                    { github = "<owner>/<repo>", tag_prefix = "v" }. Only the /latest endpoint
#                    is queried. compare = "equal" reports an update on any difference instead of
#                    only on a higher version (for versions that cannot be ordered, as with amp).
#   packages         Optional. Package name per installer, for the one-click update:
#                    { npm, pnpm, winget, pypi, brew, cask, scoop }. Hangar detects from the
#                    resolved path how the started copy was installed and runs that installer's
#                    update with this name (npm install -g --prefix <prefix> <npm>@latest,
#                    winget upgrade --id <winget> --exact, uv tool upgrade <pypi>, pipx upgrade
#                    <pypi>, brew upgrade [--cask] <brew|cask>, scoop update <scoop>). pnpm
#                    defaults to the npm name. Only names verified in the vendor docs; no
#                    look-alikes (winget Pressly.Goose, Google.Antigravity, npm cursor-agent).
#   self_update      Optional. { args = ["update"], aware = true, only = "windows" | "unix" }:
#                    the program updates itself with these arguments. aware = true: it knows how
#                    it was installed and handles every channel, so it wins over the installer
#                    command. aware = false: only for the vendor's native install.
#   update_hint      Optional. { windows = "...", unix = "..." }: an update command that overrides
#                    the detected one. Hangar shows it and, on click, runs it as a session of its
#                    own, split at whitespace into argv, without a shell. So only a simple command
#                    without shell syntax (no | & ; < > $ ` ( ) " ' % ^ ! * ? [ ] { } # ~),
#                    program as a bare name or absolute path, otherwise Hangar rejects it. The
#                    block prevents wrong splitting and interpretation by cmd.exe; it is not a
#                    sandbox: update_hint is as trustworthy as command. Prefer packages and
#                    self_update; a fixed command runs the wrong installer for a copy installed
#                    another way.
#                    Without a plan Hangar shows install_* for copying only.
#                    Values and evidence: docs/wiki/pages/agents/updates.md,
#                    docs/wiki/pages/sources/update-installers.md.
#   agent_commands   Optional. Commands the session menu and quick access offer for a running
#                    session of the program, typed in as a bracketed paste:
#                    { label_key = "compact", text = "/compact", submit = true, confirm = false }.
#                    Exactly one of label_key (a label Hangar translates: compact, clear, new,
#                    model, usage, context, status, stats) or label (own text, up to 40
#                    characters). text: one line, up to 200 characters, no leading space,
#                    each text once.
#                    submit (default true): Enter follows. confirm (default false): ask first,
#                    for commands that throw the conversation away. label_key = "compact" is
#                    also what the context meter's compact button sends from 80 % context use.
#                    A user profile with the same id and program inherits them and adds its
#                    own; an own command with the same text replaces the catalog's. Only
#                    commands found in the installed program or its docs:
#                    docs/wiki/pages/syntheses/agent-commands.md.
#   models           Optional. The vendor's models the "New session" menu offers for a start, in
#                    this order: [{ id = "opus", label = "Opus 5.5" }, ...]. id: 1 to 160
#                    characters from A-Z a-z 0-9 . _ : / @ + - [ ], no leading -; it goes into
#                    {model}. label: 1 to 80 characters, shown as is. Requires model_args.
#   model_args       Optional. How a vendor model goes into the start, with exactly the
#                    placeholder {model}: ["--model", "{model}"]. Placed after the start
#                    arguments, before agent_args and prompt_args.
#   local            Optional. How the program runs against a local LLM server on this machine:
#                    { ollama = { args = [...], env = { NAME = "value" } }, lmstudio = { ... } }.
#                    args must hold {model} and go where model_args go; env is applied after the
#                    profile's env and before its secret_env, so a user's own secret still wins.
#                    Placeholders in args and env values: {model} and {base} (the server's base
#                    URL, http://127.0.0.1:11434 for Ollama, http://127.0.0.1:1234 for LM
#                    Studio), nothing else. An empty env value sets the variable empty.
#                    A user profile with the same id and program inherits models, model_args and
#                    local, each one it does not set itself; its own value replaces the
#                    catalog's. Only flags and variables from the vendor docs:
#                    docs/wiki/pages/decisions/0022-models-and-local-llm-servers.md.
#
# Source of all entries: official vendor docs, as of 2026-11-07
# (docs/wiki/raw/2026-11-07-agent-clis-research.md, rules in docs/wiki/pages/agents/catalog.md).
# install_* only if the command is in the vendor docs. Generic names such as `q` (the old
# Amazon Q CLI) and `kd` (Kode) stay out on purpose, because they could hit other programs.
# Spot check before every release; installation methods change quickly.

[[agent]]
id = "claude"
name = "Claude Code"
commands = ["claude"]
resume_args = ["--continue"]
session_id_args = ["--session-id", "{id}"]
resume_id_args = ["--resume", "{id}"]
sub_agents = "claude"
# Measured with Claude Code 2.1.319: docs/wiki/pages/sources/claude-http-hook-measurement.md.
capabilities = { pre_edit_block = true, context_inject = true, per_session_config = true, hook_format = "claude_settings", measured = true }
# `claude --help` 2.1.323: `--append-system-prompt <prompt>` and `claude [options] [prompt]`. The
# `=` form is accepted, also with a value starting with `-` (measured with `-p` and no input: the
# input error, not "unknown option"). No file form is listed as an option.
instruction_args = ["--append-system-prompt={text}"]
prompt_args = ["{prompt}"]
# `claude --help` 2.1.325: `--agent <agent>  Agent for the current session. Overrides the 'agent'
# setting.` (docs/wiki/pages/sources/claude-agent-flag-measurement.md).
agent_args = ["--agent", "{agent}"]
# Sub-agents in .claude/agents/*.md; default model for them through CLAUDE_CODE_SUBAGENT_MODEL
# (2.1.325 binary, docs/wiki/pages/sources/sub-agent-models-research.md).
agent_program = "claude"
# Command table of the 2.1.325 binary (/usage has the aliases cost and stats):
# docs/wiki/pages/sources/agent-commands-measurement.md.
agent_commands = [
  { label_key = "compact", text = "/compact" },
  { label_key = "context", text = "/context" },
  { label_key = "usage", text = "/usage" },
  { label_key = "model", text = "/model" },
  { label_key = "clear", text = "/clear", confirm = true },
]
# `--model <alias|id>` with the aliases fable, opus, sonnet, haiku. Ollama and LM Studio speak the
# Anthropic Messages API; the variables are the ones their docs give for Claude Code (ADR 0022).
models = [
  { id = "fable", label = "Fable 5.2" },
  { id = "opus", label = "Opus 5.5" },
  { id = "sonnet", label = "Sonnet 5.5" },
  { id = "haiku", label = "Haiku 5.5" },
]
model_args = ["--model", "{model}"]
local = { ollama = { args = ["--model", "{model}"], env = { ANTHROPIC_BASE_URL = "{base}", ANTHROPIC_AUTH_TOKEN = "ollama", ANTHROPIC_API_KEY = "" } }, lmstudio = { args = ["--model", "{model}"], env = { ANTHROPIC_BASE_URL = "{base}", ANTHROPIC_AUTH_TOKEN = "lmstudio", CLAUDE_CODE_ATTRIBUTION_HEADER = "0" } } }
icon = "C"
homepage = "https://github.com/anthropics/claude-code"
install_windows = "irm https://claude.ai/install.ps1 | iex"
install_unix = "curl -fsSL https://claude.ai/install.sh | bash"
latest = { npm = "@anthropic-ai/claude-code" }
packages = { npm = "@anthropic-ai/claude-code", winget = "Anthropic.ClaudeCode" }
self_update = { args = ["update"], aware = true }

[[agent]]
id = "codex"
name = "Codex CLI"
commands = ["codex"]
resume_args = ["resume", "--last"]
# PreToolUse on apply_patch through a session layer (`-c hooks.PreToolUse=[...]`) that runs
# `hangar gate-hook codex pre-tool-use`; the helper reads every path of the patch. Accepted risk:
# a `-c` hook is untrusted (measured with 0.167.2), so the start also carries
# `--dangerously-bypass-hook-trust`, which for that run also lets the repository's own unreviewed
# hooks run. Shell writes are not hooked; the file watcher stays the second line. Measured live
# with 0.167.2 (hook fires on apply_patch, HANGAR_GATE arrives, a JSON deny with exit 0 stops the
# write): docs/wiki/pages/sources/codex-gate-live-measurement.md. 0.167.2 is the floor: the first
# release with the bypass flag is not known.
capabilities = { pre_edit_block = true, context_inject = false, per_session_config = true, hook_format = "codex_config_flags", measured = true, min_version = "0.167.2" }
# `codex --help` 0.169.0: `-c key=value` (value parsed as TOML) and `codex [OPTIONS] [PROMPT]`;
# `developer_instructions` is a top-level key of its config (found in the 0.169.0 binary).
instruction_args = ["-c", "developer_instructions={toml_text}"]
prompt_args = ["{prompt}"]
# Sub-agents in .codex/agents/*.toml; default model and effort for them through
# `-c agents.default_subagent_model=...` and `-c agents.default_subagent_reasoning_effort=...`
# (0.169.0 binary and docs, docs/wiki/pages/sources/sub-agent-models-research.md; both reach a
# spawned sub-agent, measured live with 0.171.0 in
# docs/wiki/pages/sources/codex-subagent-model-measurement.md). No option starts a session as one
# of them. Hangar copies the user's Claude Code definitions there.
agent_program = "codex"
# Command names and help texts of the 0.169.0 binary:
# docs/wiki/pages/sources/agent-commands-measurement.md.
agent_commands = [
  { label_key = "compact", text = "/compact" },
  { label_key = "status", text = "/status" },
  { label_key = "model", text = "/model" },
  { label_key = "new", text = "/new", confirm = true },
]
# `-m <model>` (gpt-6.1-terra needs CLI 0.159.0+); local models through `--oss --local-provider`
# (ADR 0022).
models = [
  { id = "gpt-6.2-sol", label = "GPT-6.2 Sol" },
  { id = "gpt-6.2-astra", label = "GPT-6.2 Astra" },
  { id = "gpt-6.1-terra", label = "GPT-6.1 Terra" },
  { id = "gpt-6-luna", label = "GPT-6 Luna" },
]
model_args = ["-m", "{model}"]
local = { ollama = { args = ["--oss", "--local-provider", "ollama", "-m", "{model}"] }, lmstudio = { args = ["--oss", "--local-provider", "lmstudio", "-m", "{model}"] } }
icon = "Cx"
homepage = "https://github.com/openai/codex"
install_windows = "powershell -ExecutionPolicy ByPass -c \"irm https://chatgpt.com/codex/install.ps1 | iex\""
install_unix = "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
latest = { npm = "@openai/codex" }
packages = { npm = "@openai/codex", winget = "OpenAI.Codex" }
self_update = { args = ["update"], aware = true }

[[agent]]
id = "gemini"
name = "Gemini CLI"
commands = ["gemini"]
resume_args = ["--resume"]
# BeforeTool on write_file and replace from a per-session system settings file
# (GEMINI_CLI_SYSTEM_SETTINGS_PATH) that runs `hangar gate-hook gemini before-tool`; the session's
# folder is trusted for the session (GEMINI_CLI_TRUST_WORKSPACE). Stays off (measured = false):
# since 0.60.0 Gemini skips a system settings file unless an administrator owns it and every
# folder above it, which a session file of Hangar's never is
# (docs/wiki/pages/sources/opencode2-and-gemini-gate-findings.md); no other per-session route
# leaves the user's setup alone (docs/wiki/pages/sources/agent-hooks-cursor-cline-gemini-opencode2-research.md).
capabilities = { pre_edit_block = true, context_inject = false, per_session_config = true, hook_format = "gemini_system_settings", measured = false, min_version = "0.68.0" }
# Sub-agents in ~/.gemini/agents/*.md (frontmatter `name` and `description`, nothing else: the
# 0.70.0 schema is strict). Measured with 0.70.0, which registers a copy before any sign-in:
# docs/wiki/pages/sources/sub-agent-formats-measurement.md.
agent_program = "gemini"
# From the vendor's command reference (not installed here, so not read from a binary):
# docs/wiki/pages/sources/agent-commands-measurement.md.
agent_commands = [
  { label_key = "compact", text = "/compress" },
  { label_key = "stats", text = "/stats" },
  { label_key = "model", text = "/model" },
  { label_key = "clear", text = "/clear", confirm = true },
]
# `-m <model>` with the aliases auto, pro, flash, flash-lite; no local models (ADR 0022).
models = [
  { id = "auto", label = "Auto" },
  { id = "pro", label = "Pro" },
  { id = "flash", label = "Flash" },
  { id = "flash-lite", label = "Flash Lite" },
]
model_args = ["-m", "{model}"]
icon = "G"
homepage = "https://github.com/google-gemini/gemini-cli"
install_windows = "npm install -g @google/gemini-cli"
install_unix = "npm install -g @google/gemini-cli"
latest = { npm = "@google/gemini-cli" }
packages = { npm = "@google/gemini-cli" }

[[agent]]
id = "antigravity"
name = "Antigravity CLI"
commands = ["agy"]
resume_args = ["--continue"]
icon = "Ag"
homepage = "https://antigravity.google"
install_windows = "irm https://antigravity.google/cli/install.ps1 | iex"
install_unix = "curl -fsSL https://antigravity.google/cli/install.sh | bash"

[[agent]]
id = "copilot"
name = "GitHub Copilot CLI"
commands = ["copilot"]
resume_args = ["--continue"]
# preToolUse on edit, create and apply_patch from a plugin loaded with --plugin-dir that runs
# `hangar gate-hook copilot pre-tool-use` without a shell. Measured live with 1.0.114 (headless and
# interactive in a ConPTY: the plugin loads after Copilot's usual folder trust question, the hook
# fires on apply_patch, HANGAR_GATE arrives, a deny keeps the file unwritten, an empty answer lets
# an add and an update through): docs/wiki/pages/sources/copilot-gate-live-measurement.md.
capabilities = { pre_edit_block = true, context_inject = false, per_session_config = true, hook_format = "copilot_plugin", measured = true, min_version = "1.0.114" }
# Custom agents in ~/.copilot/agents/<name>.agent.md, which outrank a project's. Measured with
# 1.0.114 (listed, and a headless `--agent` run answered as the copy):
# docs/wiki/pages/sources/sub-agent-formats-measurement.md.
agent_program = "copilot"
icon = "Co"
homepage = "https://github.com/github/copilot-cli"
install_windows = "winget install GitHub.Copilot"
install_unix = "curl -fsSL https://gh.io/copilot-install | bash"
latest = { npm = "@github/copilot" }
packages = { npm = "@github/copilot", winget = "GitHub.Copilot" }

# The current Cursor docs name `agent`. That is generic, so `cursor-agent` is searched first.
[[agent]]
id = "cursor"
name = "Cursor CLI"
commands = ["cursor-agent", "agent"]
resume_args = ["--continue"]
# preToolUse on Write and Delete from a local plugin loaded with --plugin-dir that runs
# `hangar gate-hook cursor pre-tool-use` (PowerShell form on Windows). Measured live with
# 2026.11.19 through cursor-agent.cmd, headless and interactive (after Cursor's usual workspace
# trust question): the hook fires, HANGAR_GATE arrives, edits come as Write with an absolute
# file_path, a deny JSON with exit 0 rejects the tool, the matcher keeps reads and shell calls
# out. Cursor loads local plugins only when signed in:
# docs/wiki/pages/sources/cursor-gate-live-measurement.md.
capabilities = { pre_edit_block = true, context_inject = false, per_session_config = true, hook_format = "cursor_plugin", measured = true, min_version = "2026.11.19" }
icon = "Cu"
homepage = "https://cursor.com/cli"
install_windows = "irm 'https://cursor.com/install?win32=true' | iex"
install_unix = "curl https://cursor.com/install -fsS | bash"

