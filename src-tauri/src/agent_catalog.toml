# Nous Research's Hermes Agent: `hermes` starts it interactively. The CLI reference lists
# `hermes chat --provider <id> -m <model>` with the provider id `lmstudio` (LM Studio's default
# server, http://localhost:1234/v1). Ollama needs a custom endpoint in ~/.hermes/config.yaml, no
# flag, so it is not offered (ADR 0022).
[[agent]]
id = "hermes"
name = "Hermes Agent"
commands = ["hermes"]
local = { lmstudio = { args = ["chat", "--provider", "lmstudio", "-m", "{model}"] } }
icon = "H"
homepage = "https://github.com/NousResearch/hermes-agent"
install_windows = "iex (irm https://hermes-agent.nousresearch.com/install.ps1)"
install_unix = "curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash"

# OpenClaw: `openclaw tui --local` runs without a gateway. No model flag at the start (models
# change with /model inside the session), so neither models nor local (ADR 0022).
[[agent]]
id = "openclaw"
name = "OpenClaw"
commands = ["openclaw"]
args = ["tui", "--local"]
icon = "OC"
homepage = "https://github.com/openclaw/openclaw"
install_windows = "iwr -useb https://openclaw.ai/install.ps1 | iex"
install_unix = "curl -fsSL https://openclaw.ai/install.sh | bash"

# First prompts Hangar gives an agent with prompt_args on a fresh start (instructions.rs).
# worktree: the session starts in a worktree Hangar has just created from the folder's branch
# (Settings can turn it off). Plain text on one line without " % ! & | < > ^, so a cmd.exe
# launcher passes it on unchanged; a test checks that.
[start_prompts]
worktree = "This session runs in a new git worktree. Run git fetch, then check whether the upstream or base branch has commits this worktree does not have yet. If so, list them briefly and ask me whether to pull or merge them before doing anything else. If not, say in one line that it is up to date."

