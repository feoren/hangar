install_windows = "npm install -g @google/gemini-cli"
install_unix = "npm install -g @google/gemini-cli"
latest = { npm = "@google/gemini-cli" }
update_hint = { windows = "npm install -g @google/gemini-cli@latest", unix = "npm install -g @google/gemini-cli@latest" }

