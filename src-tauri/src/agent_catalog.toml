# Built-in catalog of the known agent CLIs. Embedded into Hangar at build time
# (include_str!) and not editable by the user. To start an entry differently, add a [[profile]]
# with the same id to your profiles.toml. It determines name, command, arguments and
# position; homepage and install command still come from here.
#
# Hangar lists every entry under "New session" and checks on every fetch of the list whether one of
# the commands from `commands` is on the PATH. If not, the entry shows up as "not installed" with
# the platform's install command.
#
# Fields per entry (unknown fields are an error):
#   id               Required. Unique, without spaces. Same id as a user profile = overridden.
#   name             Required. Display name.
#   commands         Required, at least one entry. Plain program names without path and without extension
#                    (on Windows Hangar adds the extensions from PATHEXT). The first name found
#                    on the PATH wins and is also used for starting.
#   args             Optional. Arguments as a list; default: none.
#   icon             Optional. One or two characters for the icon in the sidebar.
#   homepage         Project page, display only (the catalog test requires it as a source).
#   install_windows  Optional. Install command as text, displayed on Windows.
#   install_unix     Optional. Install command as text, displayed on macOS and Linux.
#                    Hangar never runs install commands itself.
#   version_args     Optional. Arguments of the version query (ADR 0003); default ["--version"],
#                    [] = never query.
#   resume_args      Optional. Arguments to resume the last conversation in the working folder
#                    (when restoring a session after Hangar restarts). They
#                    REPLACE args and append nothing: a subcommand from args must come first
#                    here again (goose: args ["session"], resume_args ["session", "--resume"]).
#                    If a resume ends within 5 s with a nonzero exit code, Hangar starts once
#                    normally with args. Only add with evidence (docs/wiki/pages/agents/resume.md).
#   session_id_args  Optional. Arguments that give a fresh start a conversation id chosen by
#                    Hangar; {id} is replaced by a new UUID. APPENDED to args. Hangar stores the id
#                    with the session. A user profile with the same id and program inherits it
#                    (and resume_id_args) unless its args already contain --session-id, --resume,
#                    --continue, -c or -r; `session_id_args = []` in the profile turns it off.
#   resume_id_args   Optional. Arguments that resume exactly the conversation with the stored id
#                    ({id}). They REPLACE args; sessions without a stored id use resume_args. If
#                    this resume ends within 5 s with a nonzero exit code, Hangar starts once
#                    normally with args plus session_id_args and the same id.
#   sub_agents       Optional. Where the program keeps sub-agent transcripts that Hangar can show
#                    read-only; only "claude" so far (docs/wiki/pages/sources/subagent-transcripts.md).
#   capabilities     Optional. What Hangar's agent gate can do with the program (team service
#                    step B, docs/wiki/pages/syntheses/team-service-v1.md, section 1), all false by
#                    default: { pre_edit_block, context_inject, per_session_config,
#                    hook_format, measured, min_version }.
#                    pre_edit_block: a hook can stop an edit before it happens; context_inject: a
#                    hook can hand the agent facts as context; per_session_config: hooks can be
#                    given to one session without touching the user's settings files;
#                    hook_format: how Hangar writes its hooks for one session:
#                    "claude_settings" (Claude Code's `--settings`), "qwen_system_settings",
#                    "gemini_system_settings", "copilot_plugin", "codex_config_flags",
#                    "pi_extension", "omp_extension", "opencode_plugin" or "droid_settings"
#                    (recipes in src-tauri/src/hook_recipes.rs and
#                    docs/wiki/pages/syntheses/agent-gate-adapters.md); measured: the recipe was
#                    run once against the live program and held an edit; min_version: oldest
#                    version the recipe is known to work with (checked with the version query of
#                    ADR 0003). Hangar installs its gate, and lists the program for team
#                    sessions, only where pre_edit_block, per_session_config and measured are
#                    true, hook_format is set, the installed version reaches min_version (an
#                    unknown version does not) and no administrator's system settings file would
#                    be replaced (Gemini CLI, Qwen Code; for OpenCode an OPENCODE_CONFIG_CONTENT
#                    of the user's own in Hangar's environment).
#                    A user profile with the same id and program inherits them.
#   latest           Optional. Where the newest version is published, exactly one source:
#                    { npm = "<package>" }, { pypi = "<package>" } or
#                    { github = "<owner>/<repo>", tag_prefix = "v" }. Only the /latest endpoint
#                    is queried. compare = "equal" reports an update on any difference instead of
#                    only on a higher version (for versions that cannot be ordered, as with amp).
#   packages         Optional. Package name per installer, for the one-click update:
#                    { npm, pnpm, winget, pypi, brew, cask, scoop }. Hangar detects from the
#                    resolved path how the started copy was installed and runs that installer's
#                    update with this name (npm install -g --prefix <prefix> <npm>@latest,
#                    winget upgrade --id <winget> --exact, uv tool upgrade <pypi>, pipx upgrade
#                    <pypi>, brew upgrade [--cask] <brew|cask>, scoop update <scoop>). pnpm
#                    defaults to the npm name. Only names verified in the vendor docs; no
#                    look-alikes (winget Pressly.Goose, Google.Antigravity, npm cursor-agent).
#   self_update      Optional. { args = ["update"], aware = true, only = "windows" | "unix" }:
#                    the program updates itself with these arguments. aware = true: it knows how
#                    it was installed and handles every channel, so it wins over the installer
#                    command. aware = false: only for the vendor's native install.
#   update_hint      Optional. { windows = "...", unix = "..." }: an update command that overrides
#                    the detected one. Hangar shows it and, on click, runs it as a session of its
#                    own, split at whitespace into argv, without a shell. So only a simple command
#                    without shell syntax (no | & ; < > $ ` ( ) " ' % ^ ! * ? [ ] { } # ~),
#                    program as a bare name or absolute path, otherwise Hangar rejects it. The
#                    block prevents wrong splitting and interpretation by cmd.exe; it is not a
#                    sandbox: update_hint is as trustworthy as command. Prefer packages and
#                    self_update; a fixed command runs the wrong installer for a copy installed
#                    another way.
#                    Without a plan Hangar shows install_* for copying only.
#                    Values and evidence: docs/wiki/pages/agents/updates.md,
#                    docs/wiki/pages/sources/update-installers.md.
#
# Source of all entries: official vendor docs, as of 2026-11-07
# (docs/wiki/raw/2026-11-07-agent-clis-research.md, rules in docs/wiki/pages/agents/catalog.md).
# install_* only if the command is in the vendor docs. Generic names such as `q` (the old
# Amazon Q CLI) and `kd` (Kode) stay out on purpose, because they could hit other programs.
# Spot check before every release; installation methods change quickly.

[[agent]]
id = "claude"
name = "Claude Code"
commands = ["claude"]
resume_args = ["--continue"]
session_id_args = ["--session-id", "{id}"]
resume_id_args = ["--resume", "{id}"]
sub_agents = "claude"
# Measured with Claude Code 2.1.319: docs/wiki/pages/sources/claude-http-hook-measurement.md.
capabilities = { pre_edit_block = true, context_inject = true, per_session_config = true, hook_format = "claude_settings", measured = true }
icon = "C"
homepage = "https://github.com/anthropics/claude-code"
install_windows = "irm https://claude.ai/install.ps1 | iex"
install_unix = "curl -fsSL https://claude.ai/install.sh | bash"
latest = { npm = "@anthropic-ai/claude-code" }
packages = { npm = "@anthropic-ai/claude-code", winget = "Anthropic.ClaudeCode" }
self_update = { args = ["update"], aware = true }

[[agent]]
id = "codex"
name = "Codex CLI"
commands = ["codex"]
resume_args = ["resume", "--last"]
# PreToolUse on apply_patch through a session layer (`-c hooks.PreToolUse=[...]`) that runs
# `hangar gate-hook codex pre-tool-use`; the helper reads every path of the patch. Accepted risk:
# a `-c` hook is untrusted (measured with 0.167.2), so the start also carries
# `--dangerously-bypass-hook-trust`, which for that run also lets the repository's own unreviewed
# hooks run. Shell writes are not hooked; the file watcher stays the second line. Measured live
# with 0.167.2 (hook fires on apply_patch, HANGAR_GATE arrives, a JSON deny with exit 0 stops the
# write): docs/wiki/pages/sources/codex-gate-live-measurement.md. 0.167.2 is the floor: the first
# release with the bypass flag is not known.
capabilities = { pre_edit_block = true, context_inject = false, per_session_config = true, hook_format = "codex_config_flags", measured = true, min_version = "0.167.2" }
icon = "Cx"
homepage = "https://github.com/openai/codex"
install_windows = "powershell -ExecutionPolicy ByPass -c \"irm https://chatgpt.com/codex/install.ps1 | iex\""
install_unix = "curl -fsSL https://chatgpt.com/codex/install.sh | sh"
latest = { npm = "@openai/codex" }
packages = { npm = "@openai/codex", winget = "OpenAI.Codex" }
self_update = { args = ["update"], aware = true }

[[agent]]
id = "gemini"
name = "Gemini CLI"
commands = ["gemini"]
