# Two npm packages provide `opencode`: `@opencode/cli` (2.x) and `opencode-ai` (1.x). The version
# source is therefore the GitHub release of the official repo anomalyco/opencode (as of 2026-11-07:
# v1.19.5, matching `opencode-ai` and `opencode upgrade`). With npm `@opencode/cli`, 1.x installs would
# permanently see an "update" to 2.x that `opencode upgrade` does not deliver (docs/wiki/pages/agents/updates.md).
[[agent]]
id = "opencode"
name = "OpenCode"
commands = ["opencode"]
resume_args = ["--continue"]
# tool.execute.before on write, edit, multiedit, patch and apply_patch from an in-process plugin
# named in OPENCODE_CONFIG_CONTENT (`plugin` = its file:// URL); it asks Hangar's endpoint itself
# with HANGAR_GATE and throws the reason on a deny. Not OPENCODE_CONFIG_DIR: OpenCode runs an npm
# install in such a folder on every start. Measured live with 1.19.5 (hook fires before the write,
# HANGAR_GATE arrives, a deny keeps the file from being written, the user's own plugins still
# load, nothing is installed): docs/wiki/pages/sources/opencode-gate-live-measurement.md. Shell
# writes are not hooked.
capabilities = { pre_edit_block = true, context_inject = false, per_session_config = true, hook_format = "opencode_plugin", measured = true, min_version = "1.19.5" }
icon = "OC"
homepage = "https://opencode.ai"
install_windows = "npm install -g @opencode/cli"
install_unix = "curl -fsSL https://opencode.ai/v2/install | bash"
latest = { github = "anomalyco/opencode", tag_prefix = "v" }
# winget lists SST.opencode and Anomaly.OpenCode; which belongs to this line is open, so neither.
packages = { npm = "opencode-ai" }
self_update = { args = ["upgrade"], aware = true }

[[agent]]
id = "aider"
name = "Aider"
commands = ["aider"]
resume_args = ["--restore-chat-history"]
# No hooks: team-service-v1.md, section 1. The step A warning applies.
capabilities = { pre_edit_block = false, context_inject = false, per_session_config = false }
icon = "A"
homepage = "https://github.com/Aider-AI/aider"
install_windows = "python -m pip install aider-install && aider-install"
install_unix = "python -m pip install aider-install && aider-install"
latest = { pypi = "aider-chat" }
# aider --upgrade runs pip inside its own environment; uv and pipx installs are updated with their
# own upgrade instead, which keeps their receipt right, so there is no self_update here.
packages = { pypi = "aider-chat" }

