# Two npm packages provide `opencode`: `@opencode/cli` (2.x) and `opencode-ai` (1.x). The default
# version source is the GitHub release of the official repo anomalyco/opencode (as of 2026-11-07:
# v1.19.5, matching `opencode-ai` and `opencode upgrade`). With npm `@opencode/cli` as the default,
# 1.x installs would permanently see an "update" to 2.x that `opencode upgrade` does not deliver.
# A copy inside a global npm install of `@opencode/cli` (what install_windows sets up) takes the
# npm source of that package from `npm_variants` instead and is updated by npm, without
# `opencode upgrade` (verified for 1.x only). docs/wiki/pages/agents/updates.md
[[agent]]
id = "opencode"
name = "OpenCode"
commands = ["opencode"]
resume_args = ["--continue"]
# tool.execute.before on write, edit, multiedit, patch and apply_patch from an in-process plugin
# named in OPENCODE_CONFIG_CONTENT (`plugin` = its file:// URL); it asks Hangar's endpoint itself
# with HANGAR_GATE and throws the reason on a deny. Not OPENCODE_CONFIG_DIR: OpenCode runs an npm
# install in such a folder on every start. Measured live with 1.19.5 (hook fires before the write,
# HANGAR_GATE arrives, a deny keeps the file from being written, the user's own plugins still
# load, nothing is installed): docs/wiki/pages/sources/opencode-gate-live-measurement.md. Shell
# writes are not hooked. OpenCode 2.x is a rewrite: V1 plugins do not run, the key is `plugins`
# and names a folder, and the TUI talks to a shared background service that never sees the
# session's environment. From 2.0.0 Hangar therefore writes a V2 plugin folder
# (`tool` hook "execute.before") and starts with `--standalone`. Measured live with 2.3.2
# (headless and interactive, deny and allow, edit and shell calls):
# docs/wiki/pages/sources/opencode2-gate-live-measurement.md. 2.x before 2.3.2 is not measured.
capabilities = { pre_edit_block = true, context_inject = false, per_session_config = true, hook_format = "opencode_plugin", measured = true, min_version = "1.19.5", version_gap = { from = "2.0.0", below = "2.3.2" } }
# Sub-agents in ~/.config/opencode/agents/<name>.md with `mode: subagent`. Measured with 2.3.2
# (`opencode debug agents --standalone` lists the copy); 1.x is not measured and gets no copies:
# docs/wiki/pages/sources/sub-agent-formats-measurement.md.
agent_program = "opencode"
icon = "OC"
homepage = "https://opencode.ai"
install_windows = "npm install -g @opencode/cli"
install_unix = "curl -fsSL https://opencode.ai/v2/install | bash"
latest = { github = "anomalyco/opencode", tag_prefix = "v" }
npm_variants = [{ npm = "@opencode/cli", latest = { npm = "@opencode/cli" } }]
# winget lists SST.opencode and Anomaly.OpenCode; which belongs to this line is open, so neither.
packages = { npm = "opencode-ai" }
self_update = { args = ["upgrade"], aware = true }

[[agent]]
id = "aider"
name = "Aider"
commands = ["aider"]
resume_args = ["--restore-chat-history"]
# No hooks: team-service-v1.md, section 1. The step A warning applies.
capabilities = { pre_edit_block = false, context_inject = false, per_session_config = false }
# `aider --help` 0.86.2: `--read FILE` adds a read-only file. No first prompt: `--message` sends
# one message and exits.
instruction_args = ["--read", "{file}"]
# Local only: its vendor list is open ended. LiteLLM's ollama_chat/ and lm_studio/ prefixes with
# their base variables; LM_STUDIO_API_KEY is required, any value (ADR 0022).
local = { ollama = { args = ["--model", "ollama_chat/{model}"], env = { OLLAMA_API_BASE = "{base}" } }, lmstudio = { args = ["--model", "lm_studio/{model}"], env = { LM_STUDIO_API_BASE = "{base}/v1", LM_STUDIO_API_KEY = "dummy-api-key" } } }
icon = "A"
homepage = "https://github.com/Aider-AI/aider"
install_windows = "python -m pip install aider-install && aider-install"
install_unix = "python -m pip install aider-install && aider-install"
latest = { pypi = "aider-chat" }
# aider --upgrade runs pip inside its own environment; uv and pipx installs are updated with their
# own upgrade instead, which keeps their receipt right, so there is no self_update here.
packages = { pypi = "aider-chat" }

