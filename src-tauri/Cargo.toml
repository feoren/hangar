[package]
name = "hangar"
version = "0.6.0"
description = "Terminal sessions and agent CLIs in one window"
edition = "2021"
# Oldest Rust the code is written for: the standard library APIs in use need 1.89 (found by
# clippy's incompatible_msrv lint, which now flags anything newer). CI builds with current stable.
rust-version = "1.89"
publish = false

[lib]
name = "hangar_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# image-png: the frontend draws the taskbar badge as a PNG (overlay icon on Windows).
# tray-icon: optional icon in the notification area (tray.rs); adds tauri-apps' tray-icon crate
# (MIT/Apache-2.0), whose menu code (muda) is already in the build through Tauri's menu support.
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2.8"
# Menu Copy and Paste: navigator.clipboard fails in WebView2. Official Tauri plugin
# (MIT/Apache-2.0, maintained in plugins-workspace); adds arboard (MIT/Apache-2.0, maintained
# by 1Password), which is not in the tree otherwise.
tauri-plugin-clipboard-manager = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2"
# Settings edits profiles.toml in place and must keep the user's comments and layout (toml
# cannot). Same maintainers as toml 1.2 and shares its parser and writer crates (toml_parser,
# toml_writer, toml_datetime), so only toml_edit itself is new; MIT/Apache-2.0.
toml_edit = "0.25"
# Secret profile variables in the OS keychain: Windows Credential Manager, macOS Keychain, Secret
# Service on Linux (feature v1, the default). The maintained successor of keyring 3 (keyring-core
# plus one store crate per platform); MIT/Apache-2.0. On Windows the store crate only adds
# bindings to the Credential Manager; on Linux it adds zbus (pure Rust D-Bus).
keyring = "4.2"
# keyring's own API, used directly for the one thing keyring's v1 `Entry` cannot pass: the
# Windows store's `persistence` modifier (Local instead of the roaming Enterprise default).
# Already in the tree through keyring (same maintainers, MIT/Apache-2.0); adds no code.
keyring-core = "1"
# Secret values are wiped from memory once used (`Zeroizing<String>`). Already in the tree on
# every platform (rustls, the keyring store crates); RustCrypto, MIT/Apache-2.0; adds no code.
zeroize = "1"
portable-pty = "0.9"
# Signed updates and restart after the update (official Tauri plugins, MIT/Apache-2.0).
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
# One Hangar per user session in release builds (single_instance.rs): a second start hands its
# arguments to the running app, which brings its window to the front. Official Tauri plugin
# (MIT/Apache-2.0, maintained in plugins-workspace). The alternative, a named mutex plus a hidden
# message window on Windows, a D-Bus name on Linux and a socket on macOS, is the same code the
# plugin already maintains per platform. Adds only the plugin itself: tracing, windows-sys 0.61,
# zbus (Linux, through keyring) and tokio are already in the tree.
tauri-plugin-single-instance = "2.5"
# PNG encoding of program icons. Already part of the build through tauri (muda, ico), so it adds
# no extra code; MIT/Apache-2.0, maintained by image-rs.
png = "0.18"
# Notes (ADR 0004): stable IDs and folder keys. Both are already in the tree (uuid with v4
# through tauri, sha2 through tauri-codegen), MIT/Apache-2.0, RustCrypto and uuid-rs.
uuid = { version = "1", default-features = false, features = ["std", "v4"] }
sha2 = "0.10"
# The OpenCode gate names its plugin as a file:// URL (hook_recipes.rs); from_file_path handles
# drive letters, UNC paths and percent-encoding. Already in the tree through tauri and reqwest
# (servo/rust-url, MIT/Apache-2.0), so this adds no code.
url = "2"
# Checking for new program versions. Same crates and features as tauri-plugin-updater
# (rustls with ring, system proxy), so no extra code in the build; MIT/Apache-2.0.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Hangar account (account_service.rs): an async mutex for single-flight token refreshes, a
# notification to cancel the device flow's wait, and its timer. Tauri's async runtime is tokio
# and both features are already on in the tree (through tauri and reqwest), so this adds no code;
# MIT, maintained by the tokio-rs org.
tokio = { version = "1", default-features = false, features = ["sync", "time", "net"] }
# Team connection (team_*.rs, step F part 2a): the wire types and checks of the team protocol and
# the end-to-end cryptography, both MIT and in this repository (crates/). Path dependencies, not
# a workspace: a workspace at the repository root would move `src-tauri/target`, which the
# release tool, CI and `tauri build` rely on. Both crates are pure (no I/O); the crypto crate adds
# hpke, ed25519-dalek, chacha20poly1305, hkdf, sha2 0.11 and getrandom 0.4 (MIT, Apache-2.0 or
# BSD-3-Clause, one RustCrypto and dalek generation, listed in its own manifest).
hangar-team-protocol = { path = "../crates/hangar-team-protocol" }
hangar-team-crypto = { path = "../crates/hangar-team-crypto" }
# The relay's WebSocket. tokio-tungstenite is the de facto standard WebSocket for tokio
# (MIT, snapview org, maintained); only the handshake feature: TCP comes from tokio and
# TLS from tokio-rustls with the platform verifier below, the same stack reqwest uses, so no
# second TLS setup or root store. Adds tungstenite, tokio-tungstenite, sha1 and rand 0.9 (masking
# keys), all MIT/Apache-2.0. Alternative: a hand-written RFC 6455 client, more code to get right.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# TLS for the relay with the operating system's certificate verification. Both already in the
# tree through reqwest (MIT/Apache-2.0, rustls org), so they add no code.
tokio-rustls = { version = "0.26", default-features = false }
rustls-platform-verifier = "0.7"
# Splitting the WebSocket into a reader and a writer (Stream/Sink). Already in the tree through
# reqwest and tokio-tungstenite; MIT/Apache-2.0, rust-lang.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Local claims (claims_service.rs): file events per session worktree, only as a trigger for a git
# rescan. The de facto standard watcher (ReadDirectoryChangesW, inotify, FSEvents), maintained
# by the notify-rs org; alternatives were a hand-written watcher per platform or polling alone
# (seconds of delay, a git call per worktree every few seconds). License CC0-1.0, a documented
# exception to MIT/Apache-2.0 (public domain dedication, no obligations); notify-types is
# MIT/Apache-2.0. Adds notify, notify-types and on Linux inotify, on macOS objc2-core-services;
# walkdir, crossbeam and the rest are already in the tree.
notify = "8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  # GetDriveTypeW: the gate looks up teammates' paths only on fixed local drives (gate.rs).
  "Win32_Storage_FileSystem",
  # DeviceIoControl(FSCTL_GET_REPARSE_POINT): the executable behind a Store app's execution
  # alias (exec_alias.rs).
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  # K32GetProcessMemoryInfo: the working set of each process of a session (proctree.rs).
  "Win32_System_ProcessStatus",
  # Uninstall keys, to tell how a program was installed (install_source.rs).
  "Win32_System_Registry",
  "Win32_System_Threading",
  # ShellExecuteW: web pages open in the default browser (desktop.rs).
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Desktop notifications (notify.rs) through the WinRT toast API. The crate is already in the tree
# through tauri (tao, webview2-com), so only the two API features are new; MIT/Apache-2.0,
# Microsoft. Used directly rather than tauri-winrt-notification, which cannot set a toast tag,
# and the contract asks for one notification per session.
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications"] }

# Pasting a screenshot (clipboard_image.rs): the raw "PNG", CF_DIBV5 and CF_DIB clipboard formats,
# so Hangar checks an image's size in its header before decoding it. arboard, which the clipboard
# plugin uses, decodes them on Windows without any allocation limit, so a few kilobytes of PNG
# could abort the app. Already in the tree through arboard with the same feature, so it adds no
# code; maintained by DoumanAsh. License BSL-1.0 (Boost), a documented exception to
# MIT/Apache-2.0: permissive, no notice required in binaries, and already shipped through arboard.
clipboard-win = { version = "5.3", features = ["std"] }

[target.'cfg(not(windows))'.dependencies]
# Pasting a screenshot on macOS and Linux (clipboard_image.rs): arboard directly, because the
# clipboard plugin's `read_image` turns "no image on the clipboard" into an untyped string error.
# `image-data` is the feature that reads images; named here instead of relying on the plugin
# turning it on. Already in the tree through the plugin; MIT/Apache-2.0, 1Password; adds no code.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
