# cargo-deny: licenses, sources and bans of the app's dependencies (run in CI's audit job;
# advisories are cargo-audit's part there). `cargo deny --manifest-path src-tauri/Cargo.toml check
# licenses sources bans`.

[graph]
all-features = false

[licenses]
# Permissive licenses only. MPL-2.0 is file-level copyleft (cssparser, selectors through the
# webview's HTML parsing): unchanged use from crates.io keeps the app MIT. Unicode-3.0 and
# CDLA-Permissive-2.0 are data licenses (ICU tables, the WebPKI root certificates).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[sources]
# Only crates.io: no git dependency or other registry slips in through a lock file update.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# Several versions of one crate are common in the Tauri tree; they cost build time, not safety.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
